[project]
name = "broker-docs-verified-backend"
version = "0.1.0"
description = "Local backend for the BrokerDocs (slice 1: Compare Quotes)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.200",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.35,<2.1",
    # PyMuPDF 2.0 segfaults on import on the owner's Windows machine (probe,
    # 2026-11-01); stay on the 1.x line the spec was probed against.
    "pymupdf>=1.24,<2",
    "pydantic>=2.7,<3",
    # Provider lane (T2) was built and tested against openai 3.42.1.
    "openai>=3.42,<4",
    # T8 export: XLSX (tables) and PDF (full report). Built and tested against
    # openpyxl 3.1.5 and reportlab 4.5.1.
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    # Slice 2 T5 export: DOCX (footnotes written as raw XML, see
    # docs/specs/2026-11-02-docx-footnote-spike.md). Built and tested against
    # python-docx 1.2.0 (lxml 6.1.3).
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
# httpx backs FastAPI's TestClient in the API tests.
dev = ["pytest>=8.3", "httpx>=0.27,<1"]

# The backend is imported as the `backend` package from the repository root
# (broker-docs-verified/), so this project installs dependencies only.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra --strict-markers"
markers = [
    "live: needs OPENAI_API_KEY and spends tokens; run with pytest -m live",
]
